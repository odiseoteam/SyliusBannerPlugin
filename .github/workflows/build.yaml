name: Build

on:
    push:
        branches-ignore:
            - 'dependabot/**'
        paths-ignore:
            - "*.md"
    pull_request:
        paths-ignore:
            - "*.md"
    release:
        types: [created]
    schedule:
        -
            cron: "0 1 * * 6" # Run at 1am every Saturday
    workflow_dispatch: ~

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        runs-on: ubuntu-latest

        timeout-minutes: 30

        name: "Sylius ${{ matrix.sylius }}, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, ${{ matrix.database }}"

        strategy:
            fail-fast: false
            matrix:
                php: ["8.3"]
                symfony: ["^6.4", "^7.4"]
                sylius: ["~2.0.0", "~2.1.0", "~2.2.0", "~2.3.0"]
                database: ["mysql:8.4"]
                node: ["22.x"]

                exclude:
                    - sylius: "~2.0.0"
                      symfony: "^7.4"

                include:
                    # Cover the lowest supported PHP version (composer requires ^8.2; Sylius 2.3 needs 8.3).
                    - php: "8.2"
                      symfony: "^6.4"
                      sylius: "~2.2.0"
                      database: "mysql:8.4"
                      node: "22.x"
                    # Cover the newest PHP version.
                    - php: "8.4"
                      symfony: "^7.4"
                      sylius: "~2.3.0"
                      database: "mysql:8.4"
                      node: "22.x"
                    # Proves the PostgreSQL migrations apply.
                    - php: "8.3"
                      symfony: "^7.4"
                      sylius: "~2.3.0"
                      database: "postgres:16"
                      node: "22.x"

        env:
            APP_ENV: test

        steps:
            -
                uses: actions/checkout@v4

            -
                name: Build Sylius Test Application
                uses: SyliusLabs/BuildTestAppAction@v4
                with:
                    e2e_js: "yes"
                    cache_key: "${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}"
                    cache_restore_key: "${{ runner.os }}-php-${{ matrix.php }}-composer-"
                    database: "${{ matrix.database }}"
                    node_version: "${{ matrix.node }}"
                    php_version: "${{ matrix.php }}"
                    sylius_version: "${{ matrix.sylius }}"
                    symfony_version: "${{ matrix.symfony }}"

            -
                name: Run unit tests
                run: vendor/bin/phpunit --colors=always --testsuite=unit

            -
                name: Validate composer.json
                run: composer validate --ansi --strict

            -
                name: Validate container
                run: vendor/bin/console lint:container

            -
                name: Run PHPStan
                run: vendor/bin/phpstan analyse -c phpstan.neon

            -
                name: Run ECS
                run: vendor/bin/ecs check src tests

            -
                name: Check for unused Composer dependencies
                run: vendor/bin/composer-dependency-analyser

            -
                name: Run Non-unit PHPUnit tests
                run: vendor/bin/phpunit --colors=always --testsuite=non-unit

            -
                name: Run Behat
                run: vendor/bin/behat --colors --strict -vvv --no-interaction -f progress || vendor/bin/behat --colors --strict -vvv --no-interaction -f progress --rerun

            -
                name: Upload Behat logs
                uses: actions/upload-artifact@v4
                if: failure()
                with:
                    name: "Behat logs - Sylius ${{ matrix.sylius }} - PHP ${{ matrix.php }} - job ${{ strategy.job-index }} - ${{ github.run_id }}"
                    path: etc/build/
                    if-no-files-found: ignore
                    compression-level: 6
                    overwrite: true

    install:
        runs-on: ubuntu-latest

        timeout-minutes: 20

        name: "Fresh install on Sylius-Standard with the Flex recipe"

        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=10

        env:
            APP_ENV: dev
            DATABASE_URL: "mysql://root@127.0.0.1:3306/banner_install?serverVersion=8.4"

        steps:
            -
                uses: actions/checkout@v4

            -
                name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: "8.3"
                    extensions: intl, gd, exif, pdo_mysql
                    tools: composer:v2
                    coverage: none

            # Sylius-Standard from scratch, the recipe/ of this checkout applied by Flex, migrations and container.
            -
                name: Install the plugin on a clean Sylius-Standard
                run: .github/scripts/fresh-install.sh "${{ runner.temp }}/fresh-install"
